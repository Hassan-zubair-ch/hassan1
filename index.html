    <script>
      /* Stamped before the bundle loads: App.jsx subtracts the time the
         intro has already been on screen so a slow load doesn't wait twice. */
      window.__introStart = Date.now();
      /* The city route has never shown the dawn intro: reached by click, the
         bundle is already warm and the dawn would just flash. Awards mode
         keeps it on '/' though, because that is now the cold entry point and
         this markup is what paints the brand on the very first frame. */
      if (location.pathname === '/city' || location.pathname.indexOf('/city/') === 0) {
        var bootSky = document.getElementById('boot-sky');
        if (bootSky) bootSky.remove();
      }
    </script>
